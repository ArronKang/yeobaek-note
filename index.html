<!DOCTYPE html>
<html lang="ko" data-paper="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>여백 노트</title>
<script>
/* 첫 화면부터 다크 모드 (스타일이 뜨기 전에 흰 화면이 번쩍이지 않게) */
try { const s = JSON.parse(localStorage.getItem('yeobaek.v2.settings') || '{}');
  const dark = s.dark === 'on' || (s.dark === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) || (!s.dark && (s.theme === 'dark' || s.paper === 'dark'));
  if (dark) { document.documentElement.dataset.theme = 'dark'; document.documentElement.dataset.paper = 'dark'; document.documentElement.style.background = '#1d1e22'; }
} catch (e) {}
</script>
<link rel="stylesheet" href="vendor/pretendard/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f8f9fa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여백">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<div id="app">

  <!-- 라이브러리 -->
  <section id="lib">
    <aside id="side" aria-label="사이드바"></aside>
    <div id="scrim"></div>
    <main id="libmain"></main>
    <input type="file" id="libfile" hidden>
  </section>

  <!-- 에디터 -->
  <section id="editor" hidden>
    <header id="chrome">
      <div class="r1">
        <div class="left">
          <button type="button" class="round" id="btn-back" aria-label="라이브러리로 돌아가기"><span id="ic-back"></span></button>
          <span class="sicon" id="ic-search" aria-hidden="true"></span>
          <input id="title" type="text" aria-label="문서 제목" maxlength="60" autocomplete="off">
        </div>
        <nav id="tabs" role="tablist" aria-label="메뉴">
          <span id="ind"></span>
          <button type="button" class="tab" role="tab" data-tab="home">Home</button>
          <button type="button" class="tab" role="tab" data-tab="insert">Insert</button>
          <button type="button" class="tab" role="tab" data-tab="draw">Draw</button>
          <button type="button" class="tab" role="tab" data-tab="view">View</button>
        </nav>
        <div class="right">
          <button type="button" class="round" id="btn-share" aria-label="공유"><span id="ic-share"></span></button>
          <button type="button" class="round" id="btn-more" aria-label="더 보기"><span id="ic-more"></span></button>
        </div>
      </div>
      <div class="r2">
        <div id="tools" role="toolbar" aria-label="도구"></div>
        <div id="tray" role="toolbar" aria-label="펜 트레이"></div>
      </div>
    </header>
    <button type="button" id="handle" aria-label="도구 막대 보이기"><span id="ic-more2"></span></button>
    <aside id="pagebar" aria-label="페이지 목록"></aside>
    <div id="edge" aria-hidden="true"></div>
    <div id="panes"></div>
    <div id="chip" role="status"></div>
    <div id="saved" role="status">저장됨</div>
  </section>
</div>
<div id="overlay"></div>

<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="js/core.js"></script>
<script src="js/templates.js"></script>
<script src="js/engine.js"></script>
<script src="js/pull.js"></script>
<script src="js/pdf.js"></script>
<script src="js/editor.js"></script>
<script src="js/doctabs.js"></script>
<script src="js/quiz.js"></script>
<script src="js/samples.js"></script>
<script src="js/library.js"></script>
<script src="js/export.js"></script>
<script src="js/native.js"></script>
<script>
/* 설치형 앱: 서비스 워커로 오프라인 실행 (지원하지 않는 곳에서는 조용히 건너뜀) */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // 앱으로 돌아올 때마다 새 버전 확인
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  });
  // 새 버전이 들어오면: 막 켠 참이거나 라이브러리에 있으면 바로, 필기 중이면 라이브러리로 나갈 때 바꿈
  let swapped = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swapped) return;
    const ed = document.getElementById('editor');
    if (performance.now() < 8000 || ed.hidden) { swapped = true; location.reload(); }
    else window.Y && (Y.reloadLater = true);
  });
}
</script>
</body>
</html>
